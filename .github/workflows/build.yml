name: Build ChestCounter.exe
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/ChestCounter/ChestCounter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o dist
      - name: Publish the online build (squad exchange)
        # The server address is a repository secret, never in the code. Without it the online build asks for it in its window.
        run: dotnet publish src/ChestCounter/ChestCounter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Online=true "-p:ServerUrl=${{ secrets.SQUAD_SERVER_URL }}" -o dist-online
      - uses: actions/upload-artifact@v4
        with:
          name: ChestCounter
          path: |
            dist/ChestCounter.exe
            dist-online/ChestCounter-Online.exe
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ChestCounter.exe
            dist-online/ChestCounter-Online.exe
          body_path: RELEASE_NOTES.md
